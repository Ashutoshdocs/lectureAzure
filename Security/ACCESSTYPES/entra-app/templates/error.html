{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block body_class %}gate{% endblock %}

{% block content %}
<main class="gate-wrap">
  <div class="gate-card">
    <div class="gate-badge warn" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4M12 17h.01"/>
        <path d="M10.3 3.6 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/>
      </svg>
    </div>
    <h1 class="gate-title">Sign-in couldn’t complete</h1>
    <p class="gate-sub">{{ message }}</p>
    <a class="btn-ms" href="{{ url_for('index') }}">Back to sign in</a>
  </div>
</main>
{% endblock %}
