# =============================================================================
# PROD - WHAT-IF pipeline
# Previews what mainresource.bicep would change in the PROD environment.
# Makes NO changes. Runs automatically on pushes to main that touch the
# Bicep code or the prod parameter file, and can be run manually.
# =============================================================================
name: prod-whatif-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - main/*
      - modules/*
      - environments/prod/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  environmentName: prod
  serviceConnection: sc-azure-prod   # <-- name of the ARM service connection for PROD
  parameterFile: environments/prod/prod.parameters.json

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'What-if: prod'
    inputs:
      azureSubscription: ${{ variables.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        chmod +x scripts/*.sh
        ./scripts/bicep-deploy.sh whatif "$(parameterFile)"
