#cloud-config
package_update: true
package_upgrade: false

packages:
  - nginx
  - curl
  - git

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Azure Bicep + cloud-init</title>
      </head>
      <body>
        <h1>Azure VM configured by cloud-init</h1>
        <p>This page was created automatically during the VM's first boot.</p>
        <p>Provisioned with Azure Bicep in Central US.</p>
      </body>
      </html>

runcmd:
  - [systemctl, enable, nginx]
  - [systemctl, restart, nginx]
