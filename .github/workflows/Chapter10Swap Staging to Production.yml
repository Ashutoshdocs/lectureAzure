name: Chapter10Swap Staging to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SWAP to swap staging into production
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: swap-slots
  cancel-in-progress: false

env:
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  swap:
    if: inputs.confirm == 'SWAP'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Validate swap request
        shell: bash
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -e
          [ "$INPUT_CONFIRM" = "SWAP" ] || {
            echo "::error::Confirmation must be exactly SWAP"
            exit 1
          }
          [ -n "$WEBAPP_NAME" ] || {
            echo "::error::Set repository variable AZURE_WEBAPP_NAME"
            exit 1
          }
          [ -n "$RESOURCE_GROUP" ] || {
            echo "::error::Set repository variable AZURE_RESOURCE_GROUP"
            exit 1
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify staging slot exists
        shell: bash
        run: |
          set -e
          SLOT_COUNT=$(az webapp deployment slot list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query "length([?name=='${WEBAPP_NAME}/staging'])" \
            --output tsv)

          [ "$SLOT_COUNT" = "1" ] || {
            echo "::error::Staging slot does not exist"
            exit 1
          }

      - name: Show endpoints before swap
        shell: bash
        run: |
          for host in "$WEBAPP_NAME-staging" "$WEBAPP_NAME"; do
            echo "Checking https://$host.azurewebsites.net"
            curl -fsSL --max-time 20 \
              "https://$host.azurewebsites.net/" -o /dev/null \
              && echo "$host is responding" \
              || echo "::warning::$host did not respond successfully"
          done

      - name: Swap staging to production
        shell: bash
        run: |
          set -e
          az webapp deployment slot swap \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --slot staging \
            --target-slot production

          echo "Staging-to-production swap completed."

      - name: Verify endpoints after swap
        shell: bash
        run: |
          for host in "$WEBAPP_NAME" "$WEBAPP_NAME-staging"; do
            echo "Checking https://$host.azurewebsites.net"
            curl -fsSL --max-time 30 \
              "https://$host.azurewebsites.net/" -o /dev/null \
              && echo "$host is responding" \
              || echo "::warning::$host did not respond successfully"
          done

      - name: Swap summary
        if: always()
        run: |
          {
            echo "## Staging to Production Swap"
            echo ""
            echo "- Web App: $WEBAPP_NAME"
            echo "- Resource Group: $RESOURCE_GROUP"
            echo "- Operation: Staging → Production"
            echo "- Workflow status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"