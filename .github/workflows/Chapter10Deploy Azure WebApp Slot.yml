name: Chapter10Deploy Azure WebApp Slot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
      slot:
        description: Target slot
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.slot }}
  cancel-in-progress: false

env:
  APP_DIR: Chapter10Webapp&ContainerApp/webapp2slots
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
  INPUT_BRANCH: ${{ inputs.branch }}
  INPUT_SLOT: ${{ inputs.slot }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.slot }}
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check configuration
        shell: bash
        run: |
          set -e
          [ -n "$WEBAPP_NAME" ] || {
            echo "::error::Set repository variable AZURE_WEBAPP_NAME"
            exit 1
          }

          [ -f "$APP_DIR/index.html" ] || {
            echo "::error::$APP_DIR/index.html not found"
            exit 1
          }

          COMMIT_FULL=$(git rev-parse HEAD)
          echo "COMMIT_FULL=$COMMIT_FULL" >> "$GITHUB_ENV"
          echo "COMMIT_SHORT=${COMMIT_FULL:0:7}" >> "$GITHUB_ENV"
          echo "DEPLOY_DATE=$(date -u +'%d-%b-%Y %H:%M:%S UTC')" >> "$GITHUB_ENV"
          echo "DEPLOY_ISO=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Inject deployment information
        shell: python
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import html, os, pathlib, re, sys

          values = {
              "__REPOSITORY__": os.environ["GITHUB_REPOSITORY"],
              "__WEBAPP__": os.environ["WEBAPP_NAME"],
              "__BRANCH__": os.environ["INPUT_BRANCH"],
              "__SLOT__": os.environ["INPUT_SLOT"],
              "__COMMIT_FULL__": os.environ["COMMIT_FULL"],
              "__COMMIT__": os.environ["COMMIT_SHORT"],
              "__DATE_ISO__": os.environ["DEPLOY_ISO"],
              "__DATE__": os.environ["DEPLOY_DATE"],
              "__RUN_NUMBER__": os.environ["GITHUB_RUN_NUMBER"],
              "__RUN_URL__": os.environ["RUN_URL"],
              "__ACTOR__": os.environ["GITHUB_ACTOR"],
          }

          page = pathlib.Path(os.environ["APP_DIR"]) / "index.html"
          content = page.read_text(encoding="utf-8")

          for key in sorted(values, key=len, reverse=True):
              content = content.replace(key, html.escape(values[key], quote=True))

          page.write_text(content, encoding="utf-8")

          leftovers = sorted(set(re.findall(r"__[A-Z_]+__", content)))
          if leftovers:
              print(f"::error::Unreplaced placeholders: {leftovers}")
              sys.exit(1)

      - name: Deploy selected slot
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: ${{ inputs.slot == 'production' && '' || inputs.slot }}
          publish-profile: ${{ inputs.slot == 'production' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE || secrets.AZURE_WEBAPP_STAGING_PUBLISH_PROFILE }}
          package: ${{ env.APP_DIR }}

      - name: Verify deployment
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          set -e
          echo "Checking deployment at $URL"

          for i in $(seq 1 12); do
            if curl -fsSL -H "Cache-Control: no-cache" \
              "$URL/?v=$GITHUB_RUN_ID" | grep -q "$COMMIT_SHORT"; then
              echo "Deployment verified: $COMMIT_SHORT"
              exit 0
            fi
            echo "Waiting for deployment ($i/12)..."
            sleep 10
          done

          echo "::error::Could not verify deployed commit"
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          {
            echo "## Azure Web App deployment"
            echo ""
            echo "- Web App: $WEBAPP_NAME"
            echo "- Slot: $INPUT_SLOT"
            echo "- Branch: $INPUT_BRANCH"
            echo "- Commit: ${COMMIT_SHORT:-n/a}"
            echo "- URL: ${URL:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"