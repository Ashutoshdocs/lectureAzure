name: Deploy HTML to Azure Web App

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'serverlessInfra/webappservice/webappViaGithub/**'
      - '.github/workflows/myYamlforindexhtmldeploy.yaml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Display repository structure
      - name: Display Repository Structure
        run: |
          pwd
          ls -la
          ls -la serverlessInfra/webappservice/webappViaGithub

      # Step 3: Validate deployment files
      - name: Validate HTML Files
        run: |
          test -f serverlessInfra/webappservice/webappViaGithub/index.html
          echo "index.html found successfully"

      # Step 4: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mywebapptest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./serverlessInfra/webappservice/webappViaGithub
