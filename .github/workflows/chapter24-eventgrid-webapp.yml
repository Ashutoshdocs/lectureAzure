# Deploys Chapter24EventGrid/webapp to Azure App Service.
# MANUAL TRIGGER ONLY: pushes never deploy. Run it from
#   GitHub → Actions → "Chapter24 EventGrid - Deploy Web App" → Run workflow
#
# One-time setup (see Chapter24EventGrid/README.md, Step 0.5):
#   1. Set AZURE_WEBAPP_NAME below to your Web App name
#      (or type a different name in the "Run workflow" form each time).
#   2. Add the repo secret AZURE_WEBAPP_PUBLISH_PROFILE_EVENTGRID
#      (contents of the publish profile downloaded from the Azure Portal).

name: Chapter24 EventGrid - Deploy Web App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App name (leave empty to use AZURE_WEBAPP_NAME from the file)"
        required: false
        default: ""

env:
  AZURE_WEBAPP_NAME: app-egviewer-initials   # <-- change to your Web App name
  APP_PATH: Chapter24EventGrid/webapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Check server.js syntax
        working-directory: ${{ env.APP_PATH }}
        run: node --check server.js

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name || env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_EVENTGRID }}
          package: ${{ env.APP_PATH }}