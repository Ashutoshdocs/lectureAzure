name: Chapter10-dotnet10-webapp-demo

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: Chapter10Webapp&ContainerApp/dotnet10-webapp-demo/webapps
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Display project structure
      - name: Display Project Structure
        run: |
          pwd
          ls -la "Chapter10Webapp&ContainerApp/webapps/dotnet10-webapp-demo"
          ls -la "Chapter10Webapp&ContainerApp/webapps/dotnet10-webapp-demo/wwwroot"

      # Step 3: Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 4: Restore dependencies
      - name: Restore Dependencies
        run: |
          dotnet restore "Chapter10Webapp&ContainerApp/dotnet10-webapp-demo/webapps/Dotnet10WebappDemo.csproj"

      # Step 5: Build and publish
      - name: Build and Publish
        run: |
          dotnet publish "Chapter10Webapp&ContainerApp/dotnet10-webapp-demo/webapps/Dotnet10WebappDemo.csproj" \
            --configuration Release \
            --output "${{ github.workspace }}/publish"

      # Step 6: Verify published output
      - name: Verify Published Output
        run: |
          test -f "${{ github.workspace }}/publish/Dotnet10WebappDemo.dll"
          ls -la "${{ github.workspace }}/publish"

      # Step 7: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mywebapptest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
      #