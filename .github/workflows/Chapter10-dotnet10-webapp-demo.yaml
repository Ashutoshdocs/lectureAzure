name: Chapter10-dotnet10-webapp-demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Display repository structure
      - name: Display Repository Structure
        run: |
          pwd
          ls -la
          ls -la "Chapter10Webapp&ContainerApp/dotnet10-webapp-demo"

      # Step 3: Validate deployment files
      - name: Validate Deployment Files
        run: |
          test -f "Chapter10Webapp&ContainerApp/dotnet10-webapp-demo/index.html"
          echo "index.html found successfully"

      # Step 4: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mywebapptest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './Chapter10Webapp&ContainerApp/dotnet10-webapp-demo'