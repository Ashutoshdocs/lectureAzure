{% extends "base.html" %}

{% block content %}

<h1>Edit Student</h1>

<form
method="POST"
action="/update/{{ student[0] }}">

<label>

Student Name

</label>

<input
name="name"
value="{{ student[1] }}">

<label>

Email

</label>

<input
name="email"
value="{{ student[2] }}">

<button>

Update Student

</button>

</form>

{% endblock %}
