<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Azure Student Portal logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#004E8C"/>
    </linearGradient>
    <linearGradient id="cap" x1="128" y1="150" x2="384" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8ECFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mortarboard top -->
  <path d="M256 132 L432 212 L256 292 L80 212 Z" fill="url(#cap)"/>

  <!-- Cap base / head band -->
  <path d="M168 253 L168 320 C168 320 200 356 256 356 C312 356 344 320 344 320 L344 253 L256 292 Z" fill="#50E6FF"/>

  <!-- Tassel button + string -->
  <circle cx="432" cy="212" r="12" fill="#FFB900"/>
  <path d="M432 212 L432 300" stroke="#FFB900" stroke-width="7" stroke-linecap="round"/>
  <path d="M432 300 L432 340" stroke="#FFB900" stroke-width="7" stroke-linecap="round"/>
  <circle cx="432" cy="348" r="11" fill="#FFB900"/>
</svg>
