#cloud-config

package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - jq

write_files:
  - path: /usr/local/bin/setup-dashboard.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euxo pipefail

      WEBROOT=/var/www/html
      BASE_URL="https://raw.githubusercontent.com/Ashutoshdocs/lectureAzure/main/computeInfrastructure/VMSS"

      systemctl enable nginx
      systemctl start nginx

      # Remove default Nginx page
      rm -f "${WEBROOT}/index.nginx-debian.html"

      # Download a required file safely
      download_required() {
          local name="$1"
          local tmp
          tmp=$(mktemp)

          if curl -fLsS --retry 3 "${BASE_URL}/${name}" -o "$tmp" && [ -s "$tmp" ]; then
              mv "$tmp" "${WEBROOT}/${name}"
              echo "Downloaded ${name}"
          else
              rm -f "$tmp"
              echo "ERROR: Could not download ${name}" >&2
              return 1
          fi
      }

      # Download an optional file safely
      download_optional() {
          local name="$1"
          local tmp
          tmp=$(mktemp)

          if curl -fLsS --retry 3 "${BASE_URL}/${name}" -o "$tmp" && [ -s "$tmp" ]; then
              mv "$tmp" "${WEBROOT}/${name}"
              echo "Downloaded optional file ${name}"
          else
              rm -f "$tmp"
              echo "Optional file not found: ${name}"
          fi
      }

      download_required index.html
      download_required script.js
      download_optional style.css

      # Retrieve Azure VM metadata
      META=$(curl -fSs --retry 3 
        -H "Metadata:true" 
        "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01")

      HOSTNAME=$(echo "$META" | jq -er '.name')
      REGION=$(echo "$META" | jq -er '.location')

      # Generate dashboard configuration
      cat > "${WEBROOT}/config.js" <<EOF
      window.AZURE_CONFIG = {
          hostname: "${HOSTNAME}",
          region: "${REGION}",
          bootEpoch: $(date +%s)
      };
      EOF

      # Set website permissions
      chown -R www-data:www-data "${WEBROOT}"
      find "${WEBROOT}" -type d -exec chmod 755 {} \;
      find "${WEBROOT}" -type f -exec chmod 644 {} \;

      # Validate and restart Nginx
      nginx -t
      systemctl restart nginx

      # Verify that Nginx serves the dashboard
      curl -fSs http://127.0.0.1/ -o /dev/null

      echo "Azure VMSS Dashboard installed successfully"

runcmd:
  - bash /usr/local/bin/setup-dashboard.sh

final_message: |
  ==========================================
  Azure VMSS Dashboard Installed
  ==========================================