#cloud-config

package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - jq

write_files:
  - path: /usr/local/bin/setup-dashboard.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euxo pipefail

      WEBROOT=/var/www/html
      BASE_URL="https://raw.githubusercontent.com/Ashutoshdocs/lectureAzure/main/computeInfrastructure/VMSS"

      systemctl enable nginx
      systemctl start nginx

      # Remove default Nginx page
      rm -f "${WEBROOT}/index.nginx-debian.html"

      # Download dashboard files safely
      download_file() {
          local name="$1"
          local tmp
          tmp=$(mktemp)

          if curl -fLsS --retry 3 "${BASE_URL}/${name}" -o "$tmp"; then
              if [ ! -s "$tmp" ]; then
                  echo "ERROR: ${name} is empty" >&2
                  rm -f "$tmp"
                  return 1
              fi

              mv "$tmp" "${WEBROOT}/${name}"
              echo "Downloaded ${name} successfully"
          else
              rm -f "$tmp"
              echo "ERROR: Failed to download ${BASE_URL}/${name}" >&2
              return 1
          fi
      }

      download_file index.html
      download_file style.css
      download_file script.js

      # Retrieve Azure instance metadata
      META=$(curl -fSs --retry 3 
        -H Metadata:true 
        "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01")

      HOSTNAME=$(echo "$META" | jq -er '.name')
      REGION=$(echo "$META" | jq -er '.location')

      # Generate dashboard configuration
      cat > "${WEBROOT}/config.js" <<EOF
      window.AZURE_CONFIG = {
          hostname: "${HOSTNAME}",
          region: "${REGION}",
          bootEpoch: $(date +%s)
      };
      EOF

      # Set website permissions
      chown -R www-data:www-data "${WEBROOT}"
      find "${WEBROOT}" -type d -exec chmod 755 {} \;
      find "${WEBROOT}" -type f -exec chmod 644 {} \;

      # Validate and restart Nginx
      nginx -t
      systemctl restart nginx

      # Verify the website responds successfully
      curl -fSs http://127.0.0.1/ -o /dev/null

      echo "Azure VMSS Dashboard installed successfully"

runcmd:
  - bash /usr/local/bin/setup-dashboard.sh

final_message: |
  ==========================================
  Azure VMSS Dashboard Installed
  ==========================================