<!DOCTYPE html>

<html>

<head>

<title>Azure Student Portal</title>

<style>

body{

font-family:Arial;

background:#f2f2f2;

margin:40px;

}

.container{

width:900px;

margin:auto;

background:white;

padding:30px;

border-radius:10px;

box-shadow:0 0 10px gray;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table,th,td{

border:1px solid gray;

}

th{

background:#0078D4;

color:white;

padding:10px;

}

td{

padding:10px;

text-align:center;

}

input{

padding:8px;

margin:5px;

}

button{

padding:8px 20px;

background:green;

color:white;

border:none;

cursor:pointer;

}

a{

color:red;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>Azure Student Portal</h1>

<h2>Add Student</h2>

<form action="/add" method="post">

<input
type="text"
name="name"
placeholder="Student Name"
required>

<input
type="text"
name="course"
placeholder="Course"
required>

<input
type="number"
name="age"
placeholder="Age"
required>

<button>Add</button>

</form>

<h2>Students</h2>

<table>

<tr>

<th>ID</th>

<th>Name</th>

<th>Course</th>

<th>Age</th>

<th>Delete</th>

</tr>

{% for s in students %}

<tr>

<td>{{s[0]}}</td>

<td>{{s[1]}}</td>

<td>{{s[2]}}</td>

<td>{{s[3]}}</td>

<td>

<a href="/delete/{{s[0]}}">Delete</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
