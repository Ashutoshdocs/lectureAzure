# Shared settings for both pipelines. CHANGE appBaseName to something globally unique.
variables:
  serviceConnection: 'sc-azure-webapp-demo'   # Azure Resource Manager service connection name
  appBaseName: 'drdemoblaze'              # lowercase letters/digits/hyphens, keep it short
  primaryRegion: 'centralindia'
  primaryResourceGroup: 'rg-$(appBaseName)-primary'
  drResourceGroup: 'rg-$(appBaseName)-dr'
  sku: 'B1'                                   # Basic is enough for this demo
  runtime: 'NODE:20-lts'
  vmImage: 'ubuntu-latest'
