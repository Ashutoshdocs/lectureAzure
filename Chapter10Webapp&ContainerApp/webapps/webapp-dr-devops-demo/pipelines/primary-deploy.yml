# Pipeline 1 — PRIMARY
# Runs on every push to main that touches the app (or manually).
# Creates the primary web app if it doesn't exist, deploys the repo code, checks it's up.
name: primary-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [ main ]
  paths:
    include: [ app/*, pipelines/*, scripts/* ]

pr: none

variables:
- template: variables.yml

stages:
- template: templates/build.yml

- template: templates/provision-deploy.yml
  parameters:
    role: primary
    webAppName: $(appBaseName)-primary
    resourceGroup: $(primaryResourceGroup)
    region: $(primaryRegion)
