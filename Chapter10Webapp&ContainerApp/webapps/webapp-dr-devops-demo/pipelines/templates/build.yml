# Stage template: zip the app folder and publish it as the "webapp" pipeline artifact.
stages:
- stage: Build
  displayName: 'Build: package app'
  jobs:
  - job: Package
    pool:
      vmImage: $(vmImage)
    steps:
    - checkout: self
    - script: node --check app/server.js
      displayName: 'Sanity check the code'
    - task: ArchiveFiles@2
      displayName: 'Zip app folder'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/app'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
      artifact: webapp
      displayName: 'Publish artifact'
