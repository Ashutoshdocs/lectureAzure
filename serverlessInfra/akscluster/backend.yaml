apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init

data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS demo;

    USE demo;

    CREATE TABLE IF NOT EXISTS users (
      id INT AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(100),
      message TEXT
    );

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:

      - name: mysql

        image: mysql:8.0

        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD
          value: Password@123

        - name: MYSQL_DATABASE
          value: demo

        volumeMounts:

        - name: mysql-data
          mountPath: /var/lib/mysql

        - name: init-script
          mountPath: /docker-entrypoint-initdb.d

      volumes:

      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc

      - name: init-script
        configMap:
          name: mysql-init

---
apiVersion: v1
kind: Service
metadata:
  name: mysql

spec:
  selector:
    app: mysql

  ports:
  - port: 3306
    targetPort: 3306

  type: ClusterIP