apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:

      - name: frontend

        image: blazeak/aksclusterdemo:1.0

        ports:
        - containerPort: 80

        env:

        - name: DB_HOST
          value: mysql

        - name: DB_USER
          value: root

        - name: DB_PASSWORD
          value: Password@123

        - name: DB_NAME
          value: demo

---
apiVersion: v1
kind: Service
metadata:
  name: frontend

spec:

  type: LoadBalancer

  selector:
    app: frontend

  ports:

  - port: 80
    targetPort: 80